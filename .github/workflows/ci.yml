name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Build Shared
      run: npm run build -w packages/shared

    - name: Typecheck
      run: npm run typecheck

    - name: Run Unit Tests
      run: npm test

    - name: Build UI for E2E Tests
      run: npm run build -w packages/ui

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run E2E Tests (Mocked)
      run: npm run test:e2e:mocked
      env:
        CI: true
        TEST_BASE_URL: http://localhost:8787

  # Test Docker image to catch bundling/runtime issues
  test-docker:
    name: Test Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (server)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.server
          tags: package-broker-server:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker container startup and API
        run: |
          set -euo pipefail
          
          echo "Starting container..."
          CONTAINER_ID=$(docker run -d \
            -p 3000:3000 \
            -e DB_DRIVER=sqlite \
            -e DB_URL="/tmp/test.db" \
            -e STORAGE_DRIVER=fs \
            -e STORAGE_FS_PATH="/tmp/storage" \
            -e CACHE_DRIVER=memory \
            -e QUEUE_DRIVER=memory \
            package-broker-server:test)
          
          echo "Container ID: $CONTAINER_ID"
          
          # Wait for container to start (with timeout)
          echo "Waiting for server to start..."
          timeout=30
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            if docker logs $CONTAINER_ID 2>&1 | grep -q "Server listening"; then
              echo "Server started successfully"
              break
            fi
            sleep 1
            elapsed=$((elapsed + 1))
          done
          
          if [ $elapsed -ge $timeout ]; then
            echo "Server failed to start within $timeout seconds"
            echo "Container logs:"
            docker logs $CONTAINER_ID
            docker rm -f $CONTAINER_ID
            exit 1
          fi
          
          # Test health endpoint
          echo "Testing health endpoint..."
          sleep 2
          
          if curl -f http://localhost:3000/health 2>/dev/null; then
            echo "Health endpoint responding"
          else
            echo "Health endpoint not responding"
            docker logs $CONTAINER_ID
            docker rm -f $CONTAINER_ID
            exit 1
          fi
          
          # Test API endpoints that require database (catches DI issues)
          echo ""
          echo "Testing API endpoints (database injection check)..."
          
          # Test /api/auth/check - requires database to check user count
          AUTH_CHECK=$(curl -s -w "\n%{http_code}" http://localhost:3000/api/auth/check)
          AUTH_STATUS=$(echo "$AUTH_CHECK" | tail -1)
          AUTH_BODY=$(echo "$AUTH_CHECK" | head -n -1)
          
          if [ "$AUTH_STATUS" = "200" ]; then
            echo "Auth check endpoint works (status: $AUTH_STATUS)"
            echo "Response: $AUTH_BODY"
          else
            echo "Auth check endpoint failed (status: $AUTH_STATUS)"
            echo "Response: $AUTH_BODY"
            echo "Container logs:"
            docker logs $CONTAINER_ID
            docker rm -f $CONTAINER_ID
            exit 1
          fi
          
          # Test /api/setup endpoint - requires database to create user
          echo ""
          echo "Testing setup endpoint (creates first user)..."
          SETUP_RESP=$(curl -s -w "\n%{http_code}" -X POST http://localhost:3000/api/setup \
            -H "Content-Type: application/json" \
            -d '{"email":"test@example.com","password":"testpass123"}')
          SETUP_STATUS=$(echo "$SETUP_RESP" | tail -1)
          SETUP_BODY=$(echo "$SETUP_RESP" | head -n -1)
          
          if [ "$SETUP_STATUS" = "200" ] || [ "$SETUP_STATUS" = "201" ]; then
            echo "Setup endpoint works (status: $SETUP_STATUS)"
          elif [ "$SETUP_STATUS" = "400" ]; then
            # 400 could mean user already exists or validation error - both indicate DB works
            echo "Setup endpoint works (status: $SETUP_STATUS - validation or already exists)"
          else
            echo "Setup endpoint failed (status: $SETUP_STATUS)"
            echo "Response: $SETUP_BODY"
            echo "Container logs:"
            docker logs $CONTAINER_ID
            docker rm -f $CONTAINER_ID
            exit 1
          fi
          
          # Check for runtime errors in logs
          echo ""
          echo "Checking for runtime errors..."
          if docker logs $CONTAINER_ID 2>&1 | grep -iE "(TypeError|ReferenceError|SyntaxError|Cannot read properties of undefined)"; then
            echo "Found runtime errors in container logs:"
            docker logs $CONTAINER_ID
            docker rm -f $CONTAINER_ID
            exit 1
          fi
          
          echo ""
          echo "All Docker container tests passed"
          docker rm -f $CONTAINER_ID
