services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DB_DRIVER=sqlite
      - DB_URL=/data/db.sqlite
      - STORAGE_DRIVER=fs
      - STORAGE_PATH=/data/storage
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    volumes:
      - data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  data:
